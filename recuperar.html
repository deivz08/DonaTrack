<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recuperar contraseña | DonaTrack</title>
<meta name="description" content="Restablece la contraseña de tu cuenta de DonaTrack.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23C62828' d='M12 21s-7-4.4-9.5-9C.9 9 2.5 5 6.2 5c2 0 3.300 1 3.800 2 .5-1 1.800-2 3.800-2 3.700 0 5.300 4 3.700 7-1.500 4.600-8 9-8 9z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Nunito:wght@600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="recuperar">
<a class="skip" href="#contenido">Saltar al contenido</a>
<div id="siteHeader"></div>
<main id="contenido">

<section class="auth"><div class="auth__card">
  <a class="logo" href="index.html" style="margin-bottom:18px" aria-label="DonaTrack, ir al inicio"><span class="logo__mark" aria-hidden="true">D</span>DonaTrack</a>
  <h1>Recupera tu contraseña</h1><p class="lead">En este prototipo no se envían correos: ingresa tu correo registrado y define una nueva contraseña.</p>
  <form class="form" id="formReset" novalidate>
    <p class="msg" id="formMsg" role="alert"></p><div class="field"><label for="email">Correo electrónico</label><input type="email" id="email" autocomplete="email" aria-describedby="emailErr"><p class="ferr" id="emailErr" role="alert"></p></div><div class="field"><label for="password">Nueva contraseña</label><div class="pass"><input type="password" id="password" autocomplete="new-password" aria-describedby="passwordErr"><button class="btn btn-icon" type="button" data-pass="password" aria-pressed="false" aria-label="Mostrar contraseña"><span class="ms" aria-hidden="true">visibility</span></button></div><p class="ferr" id="passwordErr" role="alert"></p></div><div class="field"><label for="confirm">Confirmar nueva contraseña</label><div class="pass"><input type="password" id="confirm" autocomplete="new-password" aria-describedby="confirmErr"><button class="btn btn-icon" type="button" data-pass="confirm" aria-pressed="false" aria-label="Mostrar contraseña"><span class="ms" aria-hidden="true">visibility</span></button></div><p class="ferr" id="confirmErr" role="alert"></p></div>
    <button class="btn btn-dark btn-block" type="submit">Actualizar contraseña</button>
  </form>
  <div class="auth__links"><a href="login.html">Volver a iniciar sesión</a><a href="registro.html">Crear cuenta</a></div>
</div></section>
</main>
<div id="siteFooter"></div>
<script src="js/auth.js"></script>
<script src="js/layout.js"></script>
</body>
</html>
