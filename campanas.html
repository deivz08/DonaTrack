<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campañas | DonaTrack</title>
<meta name="description" content="Explora campañas, filtra por categoría y dona con seguimiento.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23C62828' d='M12 21s-7-4.4-9.5-9C.9 9 2.5 5 6.2 5c2 0 3.300 1 3.800 2 .5-1 1.800-2 3.800-2 3.700 0 5.300 4 3.700 7-1.500 4.600-8 9-8 9z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Nunito:wght@600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="campanas" data-main>
<a class="skip" href="#contenido">Saltar al contenido</a>
<div id="siteHeader"></div>
<main id="contenido">

<section class="section" aria-labelledby="t-camp">
  <div class="container">
    <div class="section__head"><span class="eyebrow">Donantes</span><h1 id="t-camp">Explora campañas y elige una causa</h1><p>Filtra por categoría, urgencia o cercanía y revisa la formalidad de la ONG antes de donar.</p></div>
    <div class="toolbar">
      <div class="field"><label for="campSearch">Buscar campaña u ONG</label><input type="search" id="campSearch" placeholder="Ej. abrigos, Manos Unidas…" autocomplete="off"></div>
      <div class="field"><label for="campSort">Ordenar por</label>
        <select id="campSort"><option value="">Más recientes</option><option value="urgencia">Más urgentes</option><option value="cercania">Más cercanas</option></select></div>
    </div>
    <div class="chips" id="campChips" role="group" aria-label="Filtrar por categoría" style="margin-bottom:20px">
      <button class="chip" type="button" data-cat="" aria-pressed="true">Todas</button>
      <button class="chip" type="button" data-cat="ninos" aria-pressed="false"><span class="ms" aria-hidden="true">child_care</span>Niños</button>
      <button class="chip" type="button" data-cat="adultos" aria-pressed="false"><span class="ms" aria-hidden="true">elderly</span>Adultos mayores</button>
      <button class="chip" type="button" data-cat="emergencias" aria-pressed="false"><span class="ms" aria-hidden="true">emergency</span>Emergencias</button>
    </div>
    <p class="small" id="campCount" role="status" style="margin-bottom:12px"></p>
    <div class="grid grid--camp" id="campGrid"></div>
    <div class="empty" id="campEmpty" role="status" hidden></div>
  </div>
</section>
</main>
<div id="siteFooter"></div>
<script src="js/auth.js"></script>
<script src="js/layout.js"></script>
<script src="js/main.js"></script>
</body>
</html>
