<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seguimiento de donaciones | DonaTrack</title>
<meta name="description" content="Ingresa tu código de trazabilidad y revisa etapas, historial y evidencias.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23C62828' d='M12 21s-7-4.4-9.5-9C.9 9 2.5 5 6.2 5c2 0 3.300 1 3.800 2 .5-1 1.800-2 3.800-2 3.700 0 5.300 4 3.700 7-1.500 4.600-8 9-8 9z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Nunito:wght@600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="seguimiento" data-main>
<a class="skip" href="#contenido">Saltar al contenido</a>
<div id="siteHeader"></div>
<main id="contenido">

<section class="section" aria-labelledby="t-seg">
  <div class="container">
    <div class="section__head"><span class="eyebrow">Donantes</span><h1 id="t-seg">Sigue tu donación con tu código de trazabilidad</h1><p>Ingresa el código que recibiste en tu comprobante. Si iniciaste sesión, aquí verás accesos directos a tus donaciones.</p>
      <div class="my-donations-shortcuts" id="myDonationCodes" aria-live="polite"></div>
    </div>
    <form class="track-form" id="formCodigo" novalidate>
      <div class="field"><label for="codigo">Código de trazabilidad</label><input type="text" id="codigo" placeholder="Ej. DT-2026-0101" autocomplete="off" aria-describedby="codigoErr"></div>
      <button class="btn btn-primary" type="submit"><span class="ms" aria-hidden="true">search</span>Buscar</button>
    </form>
    <p class="msg" id="codigoErr" role="alert" style="margin-top:12px"></p>
    <div id="segResultado" aria-live="polite" style="margin-top:24px"></div>
  </div>
</section>
</main>
<div id="siteFooter"></div>
<script src="js/auth.js"></script>
<script src="js/layout.js"></script>
<script src="js/main.js"></script>
</body>
</html>
